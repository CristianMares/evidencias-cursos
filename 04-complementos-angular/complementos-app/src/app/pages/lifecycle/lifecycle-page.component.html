<h2>Ciclo de vida</h2>
<hr />

<div class="row">
  <div class="col-md-6">
    <input
      type="text"
      class="form-control mb-3"
      placeholder="Escribe un nombre"
      [value]="name()"
      (input)="name.set(txtName.value)"
      #txtName
    />

    <div class="mb-3">
      <button class="btn btn-primary me-2" (click)="toggleChild()">
        {{ showChild() ? 'Ocultar' : 'Mostrar' }} componente hijo
      </button>
      <button class="btn btn-outline-secondary" (click)="logService.clear()">Limpiar registro</button>
    </div>

    @if (showChild()) {
      <app-lifecycle-child [name]="name()">
        <em>Contenido proyectado desde la pagina</em>
      </app-lifecycle-child>
    }
  </div>

  <div class="col-md-6">
    <h5>Registro de hooks</h5>
    <ul class="list-group">
      @for (line of logService.logs(); track $index) {
        <li class="list-group-item">{{ line }}</li>
      }
    </ul>
  </div>
</div>
