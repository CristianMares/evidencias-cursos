<h2>Ciclo de vida</h2>
<hr />

<div class="row">
  <div class="col-md-6">
    <input
      type="text"
      class="form-control mb-3"
      placeholder="Escribe un nombre"
      [value]="name()"
      (input)="name.set(txtName.value)"
      #txtName
    />

    <app-lifecycle-child [name]="name()" />
  </div>

  <div class="col-md-6">
    <h5>Registro de hooks</h5>
    <ul class="list-group">
      @for (line of logService.logs(); track $index) {
        <li class="list-group-item">{{ line }}</li>
      }
    </ul>
  </div>
</div>
