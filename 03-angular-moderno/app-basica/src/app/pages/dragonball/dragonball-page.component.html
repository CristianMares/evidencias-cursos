<h1>Dragon Ball</h1>
<hr />

<div class="row">
  <div class="col-6">
    <h3>Agregar personaje</h3>
    <input
      type="text"
      class="form-control mb-2"
      placeholder="Nombre"
      [value]="name()"
      (input)="name.set(txtName.value)"
      #txtName
    />
    <input
      type="number"
      class="form-control mb-2"
      placeholder="Poder"
      [value]="power()"
      (input)="power.set(+txtPower.value)"
      #txtPower
    />
    <button class="btn btn-primary" (click)="addCharacter()">Agregar</button>
  </div>

  <div class="col-6">
    <h3>Personajes</h3>
    @if (characters().length === 0) {
      <div class="alert alert-warning">No hay personajes</div>
    } @else {
      <ul class="list-group">
        @for (character of characters(); track character.id) {
          <li class="list-group-item d-flex justify-content-between">
            <span [ngClass]="{ 'text-primary': character.power > 9000 }">
              {{ character.id }} - {{ character.name }}
            </span>
            <strong>{{ character.power }}</strong>
          </li>
        }
      </ul>
    }
  </div>
</div>
