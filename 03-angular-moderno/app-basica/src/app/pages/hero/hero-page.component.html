<h1>Hero Page</h1>
<hr />

<div class="container">
  <h3>{{ heroDescription() }}</h3>
  <h4>{{ capitalizedName() }}</h4>

  <div class="mb-3">
    <button class="btn btn-primary me-2" (click)="changeHero()">Cambiar heroe</button>
    <button class="btn btn-secondary me-2" (click)="changeAge()">Cambiar edad</button>
    <button class="btn btn-danger" (click)="resetForm()">Reset</button>
  </div>
</div>
