<h1>Dragon Ball Super</h1>
<hr />

<div class="row">
  <div class="col-6">
    <h3>Agregar personaje</h3>
    <input
      type="text"
      class="form-control mb-2"
      placeholder="Nombre"
      [value]="name()"
      (input)="name.set(txtName.value)"
      #txtName
    />
    <input
      type="number"
      class="form-control mb-2"
      placeholder="Poder"
      [value]="power()"
      (input)="power.set(+txtPower.value)"
      #txtPower
    />
    <button class="btn btn-primary" (click)="addCharacter()">Agregar</button>
  </div>

  <div class="col-6">
    <dragonball-character-list [characters]="characters()" />
  </div>
</div>
